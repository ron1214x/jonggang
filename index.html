<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종강 마렵다...</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #ff4d4d;
            animation: pulse 1.5s infinite;
        }
        p {
            font-size: 1.2rem;
            color: #aaaaaa;
            margin-bottom: 30px;
        }
        #timer {
            font-size: 3.5rem;
            font-weight: bold;
            font-family: monospace;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
            background: #1e1e1e;
            padding: 20px 40px;
            border-radius: 10px;
            letter-spacing: 2px;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); text-shadow: 0 0 15px rgba(255,77,77,0.7); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="title">종강해줘 ㅅㅂ 사람이 죽는다고!!!!!!!</h1>
        <p id="subtitle">이미 종강했어야할 거 같은 타이밍, 진짜 종강까지는..?</p>
        <div id="timer">계산 중...</div>
    </div>

    <script>
        // 💡 여기에 실제 종강 날짜와 시간을 입력하세요! (연도, 월-1, 일, 시, 분)
        // 주의: 자바스크립트는 월(Month)이 0부터 시작하므로 12월은 '11'로 적어야 합니다!
        const jonggangDate = new Date(2026, 11, 18, 11, 0, 0).getTime(); 

        function updateTimer() {
            const now = new Date().getTime();
            const distance = jonggangDate - now;

            if (distance < 0) {
                clearInterval(timerInterval);
                document.getElementById("title").innerText = "🎉 축 종 강 🎉";
                document.getElementById("title").style.color = "#00ffcc";
                document.getElementById("subtitle").innerText = "도비는 자유에요!!";
                document.getElementById("timer").innerText = "D-DAY PASS";
                document.body.style.backgroundColor = "#0d1b2a";
                return;
            }

            // 일, 시, 분, 초 계산
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // 두 자릿수 포맷팅 (01, 02...)
            const d = days;
            const h = hours < 10 ? "0" + hours : hours;
            const m = minutes < 10 ? "0" + minutes : minutes;
            const s = seconds < 10 ? "0" + seconds : seconds;

            document.getElementById("timer").innerText = `${d}일 ${h}:${m}:${s}`;
        }

        // 1초마다 타이머 새로고침
        const timerInterval = setInterval(updateTimer, 1000);
        updateTimer(); // 실행하자마자 첫 화면 표시
    </script>
</body>
</html>
